[package]
name = "sentinel-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reference-database management for Sentinel: a registry of the canonical CheckV / CheckM2 / Pfam / BUSCO / KOfam sources, a downloader (fetch + extract + checksum), an on-disk layout builder, and a status checker used by `sentinel doctor`."

[lib]
name = "sentinel_db"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
