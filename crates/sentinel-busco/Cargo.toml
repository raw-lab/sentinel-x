[package]
name = "sentinel-busco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Single-copy ortholog completeness (BUSCO-style): classify lineage marker genes as Complete (Single/Duplicated), Fragmented, or Missing from HMM hits, with per-ortholog score and length cutoffs."

[lib]
name = "sentinel_busco"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
sentinel-core = { path = "../sentinel-core" }
sentinel-hmmer = { path = "../sentinel-hmmer" }
