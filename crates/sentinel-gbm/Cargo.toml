[package]
name = "sentinel-gbm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust LightGBM text-model parser and gradient-boosted regression-tree evaluator. Loads the exact .gbm files CheckM2 ships and reproduces their predictions with no Python / no C LightGBM runtime."

[lib]
name = "sentinel_gbm"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
