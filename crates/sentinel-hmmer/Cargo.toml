[package]
name = "sentinel-hmmer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust Plan7 profile-HMM engine (a from-scratch hmmer-rs): HMMER3 .hmm parser, log-odds Viterbi + Forward, per-sequence and per-domain bit scores. No C, no external hmmsearch binary."

[lib]
name = "sentinel_hmmer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rayon = "1.10"
