[workspace]
resolver = "2"
members = [
    "vendor/dynamite-core",
    "vendor/cleaver-core",
    "vendor/hydra-mpp-core",
    "vendor/rustyomestats",
    "crates/sentinel-hmmer",
    "crates/sentinel-gbm",
    "crates/sentinel-core",
    "crates/sentinel-checkv",
    "crates/sentinel-checkm2",
    "crates/sentinel-busco",
    "crates/sentinel-viralverify",
    "crates/sentinel-novel",
    "crates/sentinel-gpu",
    "crates/sentinel-db",
    "crates/sentinel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
authors = ["Richard Allen White III <rwhit101@charlotte.edu>"]
repository = "https://github.com/raw-lab/sentinel"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
