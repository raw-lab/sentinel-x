[package]
name = "dynamite-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
description = "Core gene-calling algorithms for DYNAMITE."

[lib]
name = "dynamite_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rayon = "1.10"
flate2 = "1"
strum = "=0.21.0"
strum_macros = "=0.21.0"
thiserror = "1.0"

[features]
default = []
