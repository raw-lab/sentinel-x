[package]
name = "hydra-mpp-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "HydraMPP: massively-parallel processing / distributed task scaling core."

[lib]
name = "hydra_mpp_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1"
anyhow = "1"
gethostname = "0.4"
lz4_flex = { version = "0.10", default-features = false, features = ["safe-encode", "safe-decode"], optional = true }

[features]
compression = ["dep:lz4_flex"]
